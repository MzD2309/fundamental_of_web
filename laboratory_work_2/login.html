<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-image">
        <img src="images/image.jpg" alt="Фон">
    </div>

    <section class="form-wrapper">
        <form action="https://httpbin.org/post" method="POST" class="form-content">
            
            <input type="text" id="username" name="username" class="input-field" placeholder="Логин" required>

            <input type="password" id="password" name="password" class="input-field" placeholder="Пароль" required>

            <div class="checkbox-group">
                <input type="checkbox" id="remember_me" name="remember_me">
                <label for="remember_me">Запомнить меня</label>
            </div>

            <input type="submit" class="btn" value="Войти">
        </form>
    </section>
</body>
</html>
